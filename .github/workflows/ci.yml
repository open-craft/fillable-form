name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python-tests:
    name: python tests (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Install WeasyPrint system libraries
        run: sudo apt-get update && sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: pip install -e '.[test]'
      - name: Run tests
        run: make test-python

  frontend-tests:
    name: frontend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: fillable_form/frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: fillable_form/frontend
      - name: Run tests
        run: make test-frontend
